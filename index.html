<style>
*{box-sizing:border-box;margin:0;padding:0}
html{background:#ECE5D6}

/* 홈 */

.hero img{display:block;width:100%;aspect-ratio:4/5;object-fit:cover}

.chip{flex:0 0 150px;scroll-snap-align:start;background:#fff;border:1px solid #E4DAC4;border-radius:16px;padding:14px;min-height:112px;display:flex;flex-direction:column;justify-content:space-between}

.gap{height:6.48cqw}

.bub:after{content:'';position:absolute;width:2.8cqw;height:2.8cqw;background:#fff;border-right:.28cqw solid #1F2638;border-bottom:.28cqw solid #1F2638;bottom:-1.6cqw;left:var(--tx,50%);transform:translateX(-50%) rotate(45deg)}

.think:after{display:none}

.bub.shout:after{background:#FFF9E6;border-width:.5cqw}

.nav .h{margin-top:1.4cqw;font-size:3.1cqw;color:#7C7466;font-weight:500}
.who{display:block;font-size:2.4cqw;font-weight:700;color:#9A7A3E;margin-bottom:.4cqw;letter-spacing:.04em}

.flow{margin-top:4.5cqw;position:relative}

.stat{margin-top:3.5cqw;text-align:center}
.stat .big{font-size:17cqw;font-weight:900;color:#1F2A44;letter-spacing:-.04em;line-height:1}

html[lang=en] .stat .big{font-size:13cqw;letter-spacing:-.02em}

.sum li:first-child{border-top:0}
.sum li:before{content:counter(s);flex:0 0 auto;font-weight:800;color:#E3C47E}
.panel.sepia img{filter:sepia(.55) saturate(.8) brightness(1.03)}

.nav{display:flex;gap:2.6cqw;padding:2cqw 7.4cqw 0}

.nav .q{margin-top:1.3cqw;font-size:3.9cqw;font-weight:700;color:#1F2A44;line-height:1.35}

.nav span .q{color:#7C7466}
.toc{display:block;margin:4cqw 7.4cqw 0;text-align:center;padding:3.6cqw;border-radius:2.6cqw;background:#1F2A44;color:#fff;font-size:3.9cqw;font-weight:700}
.efoot{padding:8.3cqw 0 10cqw;text-align:center}
.efoot img{width:38.9cqw;mix-blend-mode:multiply;opacity:.92}
.efoot .s{margin-top:2cqw;font-size:2.2cqw;color:#8A8577}

.capture html,.capture{background:#F6F1E7}
.capture .app{max-width:none}
.capture .bar,.capture .toc,.capture .share{display:none}
.lang{position:absolute;top:14px;right:14px;z-index:3;background:rgba(255,255,255,.88);border:1px solid #D9C9A3;border-radius:999px;padding:7px 13px;font:inherit;font-size:13px;font-weight:700;color:#1F2A44;cursor:pointer;letter-spacing:.02em}
.bar .rt{display:flex;align-items:center;gap:4px}

.capture .lang,.capture .lg{display:none}
html.capture{scrollbar-width:none}
html.capture::-webkit-scrollbar,.capture ::-webkit-scrollbar{display:none;width:0}
/* 시즌 · 퀴즈 · 카드 */
.part.season .pn{background:#1F2A44}
.part.season .pt small{display:block;margin-top:3px;font-size:12.5px;font-weight:500;color:#6B6355}
.sbadge{flex:0 0 auto;font-size:12px;font-weight:800;border-radius:999px;padding:4px 9px}
.sbadge.done{background:#EAF3E6;color:#3E7B3A}.sbadge.lock{background:#F3EEE3}

.partlabel{padding:12px 18px 4px;font-size:11.5px;font-weight:800;letter-spacing:.04em;color:#A9802F}
.ep-row.rd .no{color:#B9AE97}
.ep-row.quizrow{background:#FBF6EA}.ep-row.quizrow .no{color:#A9802F;font-weight:900}
.xcard{margin:0 6.5cqw 4.5cqw;background:#fff;border:1px solid #E4DAC4;border-radius:3.5cqw;overflow:hidden;box-shadow:0 1cqw 3cqw rgba(31,42,68,.06)}
.xcard .xh{font-size:3.1cqw;font-weight:800;color:#A9802F;letter-spacing:.02em}
.xcard.real .xh{padding:4.4cqw 5.5cqw 3cqw}
.xcard.real img{display:block;width:100%}
.xcard.real p{padding:3.6cqw 5.5cqw 4.6cqw;font-size:3.7cqw;line-height:1.55;color:#2A3146}
.xcard .yt{display:block;margin:0 5.5cqw 4.6cqw;padding:3cqw;text-align:center;border-radius:2.4cqw;background:#F6F1E7;color:#B3261E;font-weight:800;font-size:3.5cqw}

.quizgo .k{font-size:2.8cqw;font-weight:800;letter-spacing:.3em;color:#E9C77B}
.quizgo .q{margin-top:1.6cqw;font-size:4.4cqw;font-weight:800;line-height:1.4}
.quizgo .h{margin-top:1.4cqw;font-size:3.2cqw;color:#D9D3C4}
.nav a.skipnext{opacity:.75}

.pre{white-space:pre-line}
.qtag{margin-top:16px;font-size:12.5px;font-weight:800;letter-spacing:.1em;color:#A9802F}

.bub{font-size:max(3.89cqw,14.5px)}.bub.whisper{font-size:max(3.3cqw,14px)}.bub.inner{font-size:max(3.3cqw,14px)}.bub.shout{font-size:max(4.6cqw,16px)}
.who{font-size:max(2.4cqw,11px);color:#80601D}
.info .it,.nav .k{font-size:max(2.6cqw,11.5px);color:#80601D}.sum .it{font-size:max(2.6cqw,11.5px)}
.nav .h{font-size:max(3.1cqw,12.5px);color:#5F5849}
.efoot .s{font-size:max(2.2cqw,11px);color:#6B6355}
.xcard .xh{font-size:max(3.1cqw,12.5px);color:#80601D}.xcard .xi p.sub{color:#5F5849}
.flow .d,.chips2 span{font-size:max(3.5cqw,13.5px)}
.hero .ey,.chip .n,.ep-row .no,.partlabel,.quizbox .qtag,.qtag,.fb .who,.review .xh,.certbox .xh{color:#80601D}
.sec .sub,.part .pt small,.home-foot p,.part .cnt,.ep-row .tag,.ep-row.off .q{color:#6B6355}
.partlabel{font-size:12px}.part .pt small{font-size:12.5px}.home-foot p{font-size:12.5px}
/* 썸네일 목차 */
.ep-row{gap:12px;padding:10px 14px}
.ep-row .th{flex:0 0 92px;height:55px;border-radius:8px;object-fit:cover;background:#EFE7D6}
.ep-row .th.ph{display:flex;align-items:center;justify-content:center;font-size:20px;color:#C9B98F}
.ep-row .mid{flex:1;min-width:0}.ep-row .mid .no{display:block;font-size:12px;font-weight:800;margin-bottom:2px}
.ep-row .mid .q{display:block}
.ep-row.rd .th{opacity:.55}
.sban{display:block;width:100%;height:110px;object-fit:cover;border-bottom:1px solid #EFE7D6}
.part.season summary{flex-wrap:nowrap}
/* 읽기 진행 막대 · 끝 '다음 화' 버튼 */
#prog{position:fixed;left:0;top:0;height:3px;width:0;background:#C9A45C;z-index:20;transition:width .1s}
#fnext{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom));transform:translate(-50%,140%);z-index:20;background:#1F2A44;color:#fff;border-radius:999px;padding:13px 22px;font-size:15px;font-weight:800;box-shadow:0 8px 24px rgba(31,42,68,.28);transition:transform .25s;white-space:nowrap;max-width:92vw;overflow:hidden;text-overflow:ellipsis}
#fnext.show{transform:translate(-50%,0)}

</style>
</head>
<body>
<div id="prog"></div><a id="fnext" href="#" style="display:none"></a>
<div class="app wrap" id="app"></div>
<script src="data.js?v=202611072149"></script>
<script src="data_en.js?v=202611072149"></script>
<script src="season.js?v=202611072149"></script>
<script>
const K = window.WEBTOON, EN = window.WEBTOON_EN;
const QS = new URLSearchParams(location.search);
const CAPTURE = QS.has('capture');
if (CAPTURE) document.documentElement.classList.add('capture');
const langKey = 'bethany-webtoon-lang';
let LANG = QS.get('lang') || localStorage.getItem(langKey) || 'ko';
if (LANG !== 'en') LANG = 'ko';
const app = document.getElementById('app');
const nl = s => s.replace(/\n/g, '<br>');
const lastKey = 'bethany-webtoon-last';
const UI_KO = { start: '1화부터 보기', cont: n => `이어 보기 · ${n}화`, starterH: '처음 오셨다면, 이것부터', starterSub: '새가족이 가장 먼저 궁금해하는 10편',
  tocH: '전체 목차', tocSub: '8부 · 63화', cnt: n => `${n}화`, read: '보기', soon: '준비 중', ep: n => `제${n}화`, epShort: n => `${n}화`,
  back: '← 목차', share: '공유', copied: '링크를 복사했어요', sum: '오늘의 정리', prev: 'PREV', next: 'NEXT EPISODE', nextSoon: 'NEXT EPISODE · 준비 중', toc: '전체 목차 보기', restart: '처음부터 다시 보기',
  foot: `웹툰 「${K.series}」 · 모바일판`, homeFoot: '웹툰 「베다니다움 감리교다움」 · 원작 『베다니다움, 감리교다움』', flow: '한눈에 보기', stat: '기억하기', siteTitle: '베다니다움 감리교다움 · 베다니 웹툰' };
let W, U;
function buildLang() {
  document.documentElement.lang = LANG;
  if (LANG !== 'en') { W = K; U = UI_KO; return; }
  U = EN.ui;
  const eps = {};
  for (const n in K.episodes) {
    const k = K.episodes[n], e = EN.episodes[n];
    if (!e) continue;
    eps[n] = { ...k, coverTitle: e.coverTitle, closing: e.closing, hook: e.hook, summary: e.summary,
      blocks: k.blocks.map((b, i) => {
        const o = e.blocks[i]; if (!o) return b;
        const m = { ...b };
        if (o.bubbles) m.bubbles = (b.bubbles || []).map((x, j) => ({ ...x, ...(o.bubbles[j] || {}), who: x.who ? (o.bubbles[j] && o.bubbles[j].who) || x.who : undefined }));
        for (const f of ['narr', 'flow', 'chips', 'stat', 'tag']) if (o[f]) m[f] = o[f];
        return m;
      }) };
  }
  W = { ...K, series: EN.series, intro: EN.intro, titles: EN.titles, parts: K.parts.map((p, i) => ({ ...p, ...EN.parts[i] })), episodes: eps };
}
const ready = n => !!W.episodes[n];
function toggleLang() { LANG = LANG === 'en' ? 'ko' : 'en'; localStorage.setItem(langKey, LANG); if (QS.has('lang')) { QS.delete('lang'); history.replaceState(null, '', location.pathname + (QS.toString() ? '?' + QS : '') + location.hash); } buildLang(); route(); }
const langBtnLabel = () => LANG === 'en' ? '한국어' : 'English';

function bubble(b) {
  if (b.sfx) return `<div class="sfx${b.gold ? ' gold' : ''}" style="left:${(b.x / 1080 * 100).toFixed(2)}%;top:${(b.y / 1350 * 100).toFixed(2)}%;font-size:${((b.fs || 70) / 1080 * 100).toFixed(2)}cqw;${b.rot != null ? `--rot:${b.rot}deg;` : ''}">${b.sfx}</div>`;
  const style = `left:${(b.x / 1080 * 100).toFixed(2)}%;top:${(b.y / 1350 * 100).toFixed(2)}%;${b.tx ? `--tx:${b.tx};` : ''}${b.fs ? `font-size:max(${(b.fs / 1080 * 100).toFixed(2)}cqw,${b.kind === 'shout' ? 15 : 14}px);` : ''}`;
  return `<div class="bub${b.think ? ' think' : ''}${b.kind ? ' ' + b.kind : ''}" style="${style}${b.rot != null ? `--rot:${b.rot}deg;` : ''}">${b.who ? `<span class="who">${b.who}</span>` : ''}${nl(b.t)}${b.think ? '<i></i><u></u>' : ''}</div>`;
}

function renderHome() {
  document.title = U.siteTitle;
  const last = +localStorage.getItem(lastKey) || 0;
  const firstReady = Object.keys(W.episodes).map(Number).sort((a, b) => a - b)[0];
  let h = `<div class="hero"><img src="cover.jpg" alt=""><div class="shade"></div><button class="lang" onclick="toggleLang()">${langBtnLabel()}</button>
    <div class="tx"><div class="ey">BETHANY WEBTOON</div><h1>${W.series}</h1><p>${W.intro}</p></div></div>
    <div class="cta"><a class="p" href="#ep-${firstReady}">${U.start}</a>${last && ready(last) ? `<a class="s" href="#ep-${last}">${U.cont(last)}</a>` : ''}</div>
    <div class="sec"><h2>${U.starterH}</h2><div class="sub">${U.starterSub}</div></div>
    <div class="chips">${W.starter.map(n => ready(n)
      ? `<a class="chip" href="#ep-${n}"><div class="n">${U.ep(n)}</div><div class="q">${W.titles[n]}</div></a>`
      : `<div class="chip off"><div class="n">${U.ep(n)} · ${U.soon}</div><div class="q">${W.titles[n]}</div></div>`).join('')}</div>
    <div class="sec"><h2>${U.tocH}</h2><div class="sub">${U.tocSub} · ${T().allSeasons}</div></div>`;
  h += seasonTOC();
  h += `<div class="home-foot"><img src="logo.png" alt="Bethany Korean United Methodist Church"><p>${U.homeFoot}</p></div>`;
  app.innerHTML = h;
  window.scrollTo(0, 0);
}

function renderEp(n) {
  const ep = W.episodes[n];
  if (!ep) { location.hash = ''; return; }
  localStorage.setItem(lastKey, n); if (!CAPTURE) markRead(n);
  document.title = `${U.ep(n)} ${W.titles[n]} · ${LANG === 'en' ? 'Bethany Webtoon' : '베다니 웹툰'}`;
  let h = `<div class="bar" id="bar"><a class="btn" href="#">${U.back}</a><div class="t">${U.ep(n)}</div><div class="rt"><button class="lg" onclick="toggleLang()">${LANG === 'en' ? '한' : 'EN'}</button><button class="share" onclick="share(${n})">${U.share}</button></div></div>`;
  for (const b of ep.blocks) {
    if (b.cover) h += `<div class="panel cover"><img src="${b.cover}" alt=""><div class="shade"></div><div class="t"><div class="eyebrow">${W.series}</div><div class="epno">${U.ep(n)}</div><div class="title">${nl(ep.coverTitle || W.titles[n])}</div></div></div>`;
    else if (b.img) h += `<div class="panel${b.sepia ? ' sepia' : ''}"><img src="${b.img}" alt="" loading="lazy">${b.tag ? `<div class="tag">${b.tag}</div>` : ''}${(b.bubbles || []).map(bubble).join('')}</div>`;
    else if (b.narr) h += `<div class="narr"><div class="bl"></div>${nl(b.narr)}</div>`;
    else if (b.gap) h += `<div class="gap"></div>`;
    else if (b.flow) h += `<div class="info"><div class="it">${b.flow.label || U.flow}</div><div class="ih">${nl(b.flow.title)}</div><div class="flow">${b.flow.steps.map((s, i) => `<div class="st"><div class="n">${i + 1}</div><div><div class="k">${s.k}</div>${s.d ? `<div class="d">${nl(s.d)}</div>` : ''}</div></div>`).join('')}</div></div>`;
    else if (b.chips) h += `<div class="info"><div class="it">${b.chips.label || U.flow}</div><div class="ih">${nl(b.chips.title)}</div><div class="chips2">${b.chips.items.map(t => `<span>${t}</span>`).join('<i>›</i>')}</div></div>`;
    else if (b.stat) h += `<div class="info"><div class="it">${b.stat.label || U.stat}</div><div class="stat"><div class="big">${b.stat.big}</div><div class="d">${nl(b.stat.d)}</div></div></div>`;
  }
  if (ep.summary) h += `<div class="sum"><div class="it">${U.sum}</div><ol>${ep.summary.map(s => `<li><span>${s}</span></li>`).join('')}</ol></div>`;
  const prev = n - 1, next = n + 1;
  h += `<div class="closing">${nl(ep.closing)}</div>${epExtras(n)}${seasonGateNav(n)}<div class="nav">`;
  if (prev >= 1 && !CAPTURE) h += ready(prev) ? `<a href="#ep-${prev}"><div class="k">${U.prev}</div><div class="q">${U.ep(prev)}</div></a>` : `<span><div class="k">${U.prev}</div><div class="q">${U.ep(prev)}</div></span>`;
  const gate = seasonGateNav(n) !== '';
  if (next <= 63) h += ready(next) ? `<a href="#ep-${next}"${gate ? ' class="skipnext"' : ''}><div class="k">${gate ? T().justNext : U.next}</div><div class="q">${U.ep(next)} · ${W.titles[next]}</div>${ep.hook ? `<div class="h">${ep.hook}</div>` : ''}</a>` : `<span><div class="k">${U.nextSoon}</div><div class="q">${U.ep(next)} · ${W.titles[next]}</div>${ep.hook ? `<div class="h">${ep.hook}</div>` : ''}</span>`;
  if (next > 63) h += `<a href="#ep-1"><div class="k">THE END</div><div class="q">${U.restart}</div></a>`;
  h += `</div><a class="toc" href="#">${U.toc}</a><div class="efoot"><img src="logo.png" alt="Bethany Korean United Methodist Church"><div class="s">${U.foot}</div></div>`;
  app.innerHTML = h;
  fitBubbles(); if (document.fonts && document.fonts.ready) document.fonts.ready.then(fitBubbles);
  window.scrollTo(0, 0);
  let lastY = 0; const bar = document.getElementById('bar');
  const pb = document.getElementById('prog'), fn = document.getElementById('fnext');
  const nx = (n < 63 && ready(n + 1) && seasonGateNav(n) === '') ? `#ep-${n + 1}` : (seasonGateNav(n) ? `#quiz-${seasonOf(n).n}` : (n >= 63 ? '#ep-1' : ''));
  if (fn) { fn.style.display = nx ? '' : 'none'; fn.href = nx; fn.textContent = nx.startsWith('#quiz') ? `${T().quiz(seasonOf(n).n)} →` : n >= 63 ? U.restart : `${U.ep(n + 1)} →`; }
  window.onscroll = () => { const y = window.scrollY; if (bar) bar.classList.toggle('hide', y > lastY && y > 120); lastY = y; const H = document.documentElement.scrollHeight - innerHeight; const r = H > 0 ? y / H : 0; if (pb) pb.style.width = (r * 100).toFixed(1) + '%'; if (fn) { const nv = document.querySelector('.nav'); const navIn = nv && nv.getBoundingClientRect().top < innerHeight - 20; fn.classList.toggle('show', r > .7 && !navIn); } };
}

async function share(n) {
  const url = location.href.split('#')[0].split('?')[0] + (LANG === 'en' ? '?lang=en' : '') + '#ep-' + n;
  const data = { title: LANG === 'en' ? `Bethany Webtoon · Episode ${n}` : `베다니 웹툰 제${n}화`, text: W.titles[n], url };
  try { if (navigator.share) await navigator.share(data); else { await navigator.clipboard.writeText(url); alert(U.copied); } } catch (e) {}
}

// ===== 시즌 · 퀴즈 · 화별 카드 =====
const X = window.WEBTOON_X || { seasons: [], ep: {}, quiz: {} };
const QK = 'bethany-webtoon-quiz', SKIPK = 'bethany-webtoon-skip', READK = 'bethany-webtoon-read', NAMEK = 'bethany-webtoon-name';
const jget = (k, d) => { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch (e) { return d; } };
const jset = (k, v) => localStorage.setItem(k, JSON.stringify(v));
const QT = {
  ko: { season: n => `시즌 ${n}`, eps: (a, b) => `${a}~${b}화`, lockT: n => `시즌 ${n} 퀴즈를 풀면 열려요`, open: '열림', done: '수료',
    read: (a, b) => `${a}/${b}화 읽음`, quiz: n => `시즌 ${n} 퀴즈`, quizGo: n => `시즌 ${n} 완주! 퀴즈 풀고 다음 시즌 열기`, quizSub: '10문제 중 6개 이상 맞히면 다음 시즌이 열려요',
    justNext: '퀴즈 없이 다음 화 보기', lockH: '잠깐! 다음 시즌은 퀴즈를 풀면 열려요', lockP: (s) => `시즌 ${s} 내용을 퀴즈로 한 번 정리해 볼까요?\n10문제 중 6개 이상이면 통과예요. 몇 번이든 다시 도전할 수 있어요.`,
    takeQuiz: '퀴즈 풀러 가기', skip: '그냥 볼게요', start: '시작하기', qof: (i, t) => `${i} / ${t}`, o: 'O 맞아요', x: 'X 아니에요', check: '확인', next: '다음 문제', result: '결과 보기',
    orderHint: '순서대로 눌러 주세요. 다시 누르면 취소돼요.', right: ['정답! 나 천재 아니야?', '딩동댕~!', '와, 완전 정답!'], wrong: '근데 그건 왜 그런 거예요?', host: '하민', dad: '아빠',
    score: (s, t) => `${t}문제 중 ${s}개 정답`, pass: '통과! 다음 시즌이 열렸어요', fail: '아쉬워요! 6개 이상이면 열려요', retry: '다시 도전', review: '다시 보면 좋은 화', goNext: n => `시즌 ${n} 시작하기`,
    cert: '수료 카드 만들기', namePh: '이름을 적어 주세요', save: '카드 저장·공유', certT: '수료 카드', certLine: (s) => `시즌 ${s} 수료`, home: '목차로',
    intro: n => `시즌 ${n}에서 배운 예배 이야기를\n퀴즈로 정리해 볼까요?`, readMore: '이 내용은', inEp: n => `${n}화에 있어요`,
    realH: '실제 베다니에서는', tryH: '이번 주일에 해 보기', talkH: '가족과 나눌 질문', yt: '베다니 예배 영상 보기', allSeasons: '시즌별 보기', partLabel: '원작' },
  en: { season: n => `Season ${n}`, eps: (a, b) => `Ep. ${a}–${b}`, lockT: n => `Unlocks after the Season ${n} quiz`, open: 'Open', done: 'Completed',
    read: (a, b) => `${a}/${b} read`, quiz: n => `Season ${n} Quiz`, quizGo: n => `Season ${n} complete! Take the quiz to unlock the next season`, quizSub: 'Get 6 out of 10 right to unlock the next season',
    justNext: 'Skip the quiz and keep reading', lockH: 'Hold on! The next season unlocks with a quiz', lockP: (s) => `Want to review Season ${s} with a quick quiz?\nGet 6 out of 10 to pass. You can retry as many times as you like.`,
    takeQuiz: 'Take the quiz', skip: 'Just let me read', start: 'Start', qof: (i, t) => `${i} / ${t}`, o: 'O  True', x: 'X  False', check: 'Check', next: 'Next', result: 'See results',
    orderHint: 'Tap in order. Tap again to undo.', right: ['Correct! Am I a genius or what?', 'Ding-ding-ding!', 'Totally right!'], wrong: 'Wait, but why is that?', host: 'Hamin', dad: 'Dad',
    score: (s, t) => `${s} of ${t} correct`, pass: 'You passed! The next season is unlocked', fail: 'So close! You need 6 to pass', retry: 'Try again', review: 'Episodes worth another look', goNext: n => `Start Season ${n}`,
    cert: 'Make my completion card', namePh: 'Your name', save: 'Save / share card', certT: 'Completion Card', certLine: (s) => `Season ${s} Completed`, home: 'Contents',
    intro: n => `Ready to review what you learned\nin Season ${n}?`, readMore: 'Find this in', inEp: n => `Episode ${n}`,
    realH: 'At the Real Bethany', tryH: 'Try It This Sunday', talkH: 'Talk About It as a Family', yt: 'Watch Bethany worship videos', allSeasons: 'By Season', partLabel: 'Book' },
};
const T = () => QT[LANG] || QT.ko;
const seasonOf = n => X.seasons.find(s => n >= s.eps[0] && n <= s.eps[1]);
const quizPassed = s => (jget(QK, {})[s] || 0) >= ((X.quiz[s] || {}).pass || 6);
const seasonUnlocked = s => s <= 1 || !X.quiz[s - 1] || quizPassed(s - 1) || (jget(SKIPK, {})[s] === true);
function markRead(n) { const r = jget(READK, []); if (!r.includes(n)) { r.push(n); jset(READK, r); } }

function seasonTOC() {
  const t = T(); const rd = jget(READK, []);
  let h = '';
  X.seasons.forEach((s, i) => {
    const st = s[LANG] || s.ko; const [a, b] = s.eps; const eps = []; for (let k = a; k <= b; k++) eps.push(k);
    const nread = eps.filter(k => rd.includes(k)).length; const un = seasonUnlocked(s.n); const passed = quizPassed(s.n);
    const badge = passed ? `<span class="sbadge done">✓ ${t.done}</span>` : !un ? `<span class="sbadge lock">🔒</span>` : '';
    h += `<details class="part season${un ? '' : ' locked'}"${i === 0 ? ' open' : ''}><summary><span class="pn">${t.season(s.n)}</span><span class="pt">${st.title}<small>${t.eps(a, b)} · ${t.partLabel} ${st.parts}${nread ? ` · ${t.read(nread, eps.length)}` : ''}</small></span>${badge}</summary><img class="sban" src="thumb_s${s.n}.webp" alt="" loading="lazy" onerror="this.remove()">`;
    if (!un) h += `<div class="lockrow">🔒 ${t.lockT(s.n - 1)} <a href="#quiz-${s.n - 1}">${t.takeQuiz} →</a></div>`;
    let lastPart = null;
    for (const k of eps) {
      const p = W.parts.find(pp => pp.eps.includes(k));
      if (p && p !== lastPart) { h += `<div class="partlabel">${p.name} · ${p.title}</div>`; lastPart = p; }
      const href = un ? `#ep-${k}` : `#lock-${s.n}-${k}`;
      const th = `<img class="th" src="thumb_ep${String(k).padStart(2, '0')}.webp" alt="" loading="lazy" onerror="this.outerHTML='<span class=&quot;th ph&quot;>✦</span>'">`;
      h += ready(k) ? `<a class="ep-row${rd.includes(k) ? ' rd' : ''}" href="${href}">${th}<span class="mid"><span class="no">${U.epShort(k)}</span><span class="q">${W.titles[k]}</span></span><span class="tag new">${rd.includes(k) ? '✓' : U.read}</span></a>`
        : `<div class="ep-row off"><span class="th ph">✦</span><span class="mid"><span class="no">${U.epShort(k)}</span><span class="q">${W.titles[k]}</span></span><span class="tag">${U.soon}</span></div>`;
    }
    if (X.quiz[s.n]) h += `<a class="ep-row quizrow" href="#quiz-${s.n}"><span class="no">Q</span><span class="q">${t.quiz(s.n)}${passed ? ' ✓' : ''}</span><span class="tag new">GO</span></a>`;
    h += `</details>`;
  });
  return h;
}

function epExtras(n) {
  const x = X.ep[n]; if (!x) return ''; const t = T(); let h = '';
  if (x.real) h += `<div class="xcard real"><div class="xh">📍 ${t.realH}</div><img src="${x.real.img}" alt="" loading="lazy"><p>${x.real[LANG] || x.real.ko}</p>${n % 4 === 0 ? `<a class="yt" href="${X.youtube}" target="_blank" rel="noopener">▶ ${t.yt}</a>` : ''}</div>`;
  if (x.tryit || x.talk) h += `<div class="xcard two">${x.tryit ? `<div class="xi"><div class="xh">✅ ${t.tryH}</div><p>${x.tryit[LANG] || x.tryit.ko}</p></div>` : ''}${x.talk ? `<div class="xi"><div class="xh">💬 ${t.talkH}</div><p>${x.talk[LANG] || x.talk.ko}</p>${LANG === 'ko' && x.talk.en ? `<p class="sub">${x.talk.en}</p>` : ''}</div>` : ''}</div>`;
  return h;
}

function seasonGateNav(n) {
  const s = seasonOf(n); if (!s || n !== s.eps[1] || !X.quiz[s.n] || quizPassed(s.n) || CAPTURE) return '';
  const t = T();
  return `<a class="quizgo" href="#quiz-${s.n}"><div class="k">QUIZ</div><div class="q">${t.quizGo(s.n)}</div><div class="h">${t.quizSub}</div></a>`;
}

function renderLock(s, k) {
  const t = T(); document.title = t.quiz(s - 1);
  app.innerHTML = `<div class="bar" id="bar"><a class="btn" href="#">${U.back}</a><div class="t">${t.season(s)}</div><div class="rt"></div></div>
    <div class="quizbox"><div class="qimg"><img src="ep12_together.jpg" alt=""></div><h2>${t.lockH}</h2><p class="pre">${t.lockP(s - 1)}</p>
    <a class="qbtn p" href="#quiz-${s - 1}">${t.takeQuiz}</a><button class="qbtn link" onclick="skipSeason(${s},${k})">${t.skip}</button></div>`;
  window.scrollTo(0, 0);
}
function skipSeason(s, k) { const sk = jget(SKIPK, {}); sk[s] = true; jset(SKIPK, sk); location.hash = '#ep-' + k; }

let QS_ = null;
function shuffle(a) { const b = a.slice(); for (let i = b.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [b[i], b[j]] = [b[j], b[i]]; } return b; }
function renderQuiz(s) {
  const Q = X.quiz[s]; if (!Q) { location.hash = ''; return; }
  const t = T(); document.title = t.quiz(s);
  QS_ = { s, i: -1, score: 0, wrong: [], pick: [], answered: false };
  app.innerHTML = `<div class="bar" id="bar"><a class="btn" href="#">${U.back}</a><div class="t">${t.quiz(s)}</div><div class="rt"><button class="lg" onclick="toggleLang()">${LANG === 'en' ? '한' : 'EN'}</button></div></div><div id="qz"></div>`;
  document.getElementById('qz').innerHTML = `<div class="quizbox"><div class="qimg"><img src="ep12_together.jpg" alt=""></div><div class="qtag">${t.season(s)} · ${(X.seasons[s - 1][LANG] || X.seasons[s - 1].ko).title}</div><h2 class="pre">${t.intro(s)}</h2><p>${t.quizSub}</p><button class="qbtn p" onclick="qNext()">${t.start}</button></div>`;
  window.scrollTo(0, 0);
}
function qNext() {
  const Q = X.quiz[QS_.s]; QS_.i++; QS_.answered = false; QS_.pick = [];
  if (QS_.i >= Q.q.length) return qResult();
  const t = T(); const it = Q.q[QS_.i]; const L = it[LANG] || it.ko;
  let body = '';
  if (it.type === 'ox') body = `<div class="ox"><button onclick="qAns(true)">${t.o}</button><button onclick="qAns(false)">${t.x}</button></div>`;
  else if (it.type === 'mc') body = `<div class="mc">${L.o.map((o, k) => `<button onclick="qAns(${k})"><b>${k + 1}</b>${o}</button>`).join('')}</div>`;
  else if (it.type === 'order') { QS_.ord = shuffle(L.o.map((o, k) => k)); body = `<p class="hint">${t.orderHint}</p><div class="ord" id="ord">${QS_.ord.map(k => `<button data-k="${k}" onclick="qOrd(${k},this)">${L.o[k]}<i></i></button>`).join('')}</div><button class="qbtn p" id="ordok" disabled onclick="qAns('order')">${t.check}</button>`; }
  document.getElementById('qz').innerHTML = `<div class="quizbox q"><div class="qprog"><span style="width:${(QS_.i / Q.q.length * 100).toFixed(0)}%"></span></div><div class="qtag">${t.qof(QS_.i + 1, Q.q.length)}</div><h2>${L.q}</h2>${body}<div id="fb"></div></div>`;
  window.scrollTo(0, 0);
}
function qOrd(k, el) {
  const p = QS_.pick; const at = p.indexOf(k);
  if (QS_.answered) return;
  if (at >= 0) p.splice(at, 1); else p.push(k);
  document.querySelectorAll('#ord button').forEach(b => { const kk = +b.dataset.k; const ix = p.indexOf(kk); b.classList.toggle('on', ix >= 0); b.querySelector('i').textContent = ix >= 0 ? ix + 1 : ''; });
  document.getElementById('ordok').disabled = p.length !== QS_.ord.length;
}
function qAns(v) {
  if (QS_.answered) return; QS_.answered = true;
  const Q = X.quiz[QS_.s]; const it = Q.q[QS_.i]; const L = it[LANG] || it.ko; const t = T();
  let ok;
  if (it.type === 'order') ok = QS_.pick.every((k, i) => k === i);
  else ok = v === it.a;
  if (ok) QS_.score++; else QS_.wrong.push(QS_.i);
  document.querySelectorAll('.quizbox.q button').forEach(b => b.disabled = true);
  if (it.type === 'ox') { const bs = document.querySelectorAll('.ox button'); bs[it.a ? 0 : 1].classList.add('right'); if (!ok) bs[v ? 0 : 1].classList.add('bad'); }
  if (it.type === 'mc') { const bs = document.querySelectorAll('.mc button'); bs[it.a].classList.add('right'); if (!ok) bs[v].classList.add('bad'); }
  if (it.type === 'order') document.querySelectorAll('#ord button').forEach(b => b.classList.add(ok ? 'right' : 'bad'));
  const last = QS_.i === Q.q.length - 1;
  document.getElementById('fb').innerHTML = `<div class="fb ${ok ? 'ok' : 'no'}"><div class="who">${ok ? t.host : t.dad}</div><div class="say">${ok ? t.right[QS_.i % t.right.length] : t.wrong}</div><p>${L.ex}</p><a href="#ep-${it.ep}" class="epl">${t.readMore} ${t.inEp(it.ep)}</a></div><button class="qbtn p" onclick="qNext()">${last ? t.result : t.next}</button>`;
  document.getElementById('fb').scrollIntoView({ behavior: 'smooth', block: 'nearest' });
}
function qResult() {
  const s = QS_.s; const Q = X.quiz[s]; const t = T(); const sc = QS_.score; const tot = Q.q.length; const pass = sc >= Q.pass;
  const best = jget(QK, {}); if (!best[s] || sc > best[s]) { best[s] = sc; jset(QK, best); }
  const nextS = X.seasons[s]; const wrongEps = [...new Set(QS_.wrong.map(i => Q.q[i].ep))];
  let h = `<div class="quizbox"><div class="big ${pass ? 'ok' : ''}">${sc}<small>/${tot}</small></div><h2>${pass ? t.pass : t.fail}</h2><p>${t.score(sc, tot)}</p>`;
  if (wrongEps.length) h += `<div class="review"><div class="xh">${t.review}</div>${wrongEps.map(e => `<a href="#ep-${e}">${U.ep(e)} · ${W.titles[e]}</a>`).join('')}</div>`;
  if (pass) h += `<div class="certbox"><div class="xh">🎓 ${t.certT}</div><input id="cname" placeholder="${t.namePh}" value="${(localStorage.getItem(NAMEK) || '').replace(/"/g, '')}" maxlength="16"><button class="qbtn p" onclick="makeCert(${s},${sc},${tot})">${t.cert}</button><div id="certout"></div></div>`
    + (nextS ? `<a class="qbtn p" href="#ep-${nextS.eps[0]}">${t.goNext(nextS.n)}</a>` : '');
  else h += `<button class="qbtn p" onclick="renderQuiz(${s})">${t.retry}</button>`;
  h += `<a class="qbtn link" href="#">${t.home}</a></div>`;
  document.getElementById('qz').innerHTML = h; window.scrollTo(0, 0);
}
async function makeCert(s, sc, tot) {
  const t = T(); const name = (document.getElementById('cname').value || '').trim(); localStorage.setItem(NAMEK, name);
  const st = X.seasons[s - 1][LANG] || X.seasons[s - 1].ko;
  const c = document.createElement('canvas'); c.width = 1080; c.height = 1350; const g = c.getContext('2d');
  try { await document.fonts.ready; } catch (e) {}
  const F = (w, z) => `${w} ${z}px Pretendard, 'Apple SD Gothic Neo', sans-serif`;
  g.fillStyle = '#1F2A44'; g.fillRect(0, 0, 1080, 1350);
  g.strokeStyle = '#C9A45C'; g.lineWidth = 6; g.strokeRect(50, 50, 980, 1250); g.lineWidth = 2; g.strokeRect(70, 70, 940, 1210);
  const img = new Image(); img.src = 'ep12_together.jpg';
  await new Promise(r => { img.onload = r; img.onerror = r; });
  if (img.naturalWidth) { g.save(); g.beginPath(); g.arc(540, 420, 190, 0, Math.PI * 2); g.clip(); g.drawImage(img, 540 - 240, 420 - 300, 480, 600); g.restore(); g.strokeStyle = '#C9A45C'; g.lineWidth = 6; g.beginPath(); g.arc(540, 420, 190, 0, Math.PI * 2); g.stroke(); }
  g.textAlign = 'center'; g.fillStyle = '#C9A45C'; g.font = F(700, 34); g.fillText(LANG === 'en' ? 'BETHANY WAY, METHODIST WAY' : '베다니다움 감리교다움', 540, 160);
  g.fillStyle = '#fff'; g.font = F(800, 74); g.fillText(t.certLine(s), 540, 720);
  g.fillStyle = '#E9DDBE'; g.font = F(600, 40); g.fillText(st.title, 540, 790);
  g.fillStyle = '#fff'; g.font = F(800, 88); g.fillText(name || (LANG === 'en' ? 'Bethany Friend' : '베다니 가족'), 540, 950);
  g.fillStyle = '#C9A45C'; g.fillRect(340, 985, 400, 3);
  g.fillStyle = '#E9DDBE'; g.font = F(500, 36); g.fillText(t.score(sc, tot), 540, 1060);
  const d = new Date(); g.font = F(500, 30); g.fillText(LANG === 'en' ? d.toLocaleDateString('en-US', { year: 'numeric', month: 'long', day: 'numeric' }) : `${d.getFullYear()}년 ${d.getMonth() + 1}월 ${d.getDate()}일`, 540, 1110);
  g.fillStyle = '#fff'; g.font = F(700, 34); g.fillText(LANG === 'en' ? 'Bethany Korean United Methodist Church' : '베다니 한인연합감리교회', 540, 1220);
  const url = c.toDataURL('image/png');
  const out = document.getElementById('certout');
  out.innerHTML = `<img src="${url}" alt="" class="certimg"><button class="qbtn p" id="certsave">${t.save}</button>`;
  document.getElementById('certsave').onclick = async () => {
    try { const blob = await (await fetch(url)).blob(); const file = new File([blob], `bethany-season${s}.png`, { type: 'image/png' });
      if (navigator.canShare && navigator.canShare({ files: [file] })) { await navigator.share({ files: [file], title: t.certLine(s) }); return; } } catch (e) {}
    const a = document.createElement('a'); a.href = url; a.download = `bethany-season${s}.png`; a.click();
  };
}

function fitBubbles() {
  document.querySelectorAll('.panel').forEach(p => {
    const pr = p.getBoundingClientRect(), W = pr.width, H = W * 1.25, m = 4;
    p.querySelectorAll('.bub,.sfx').forEach(b => {
      b.style.marginLeft = ''; b.style.marginTop = '';
      const q = b.getBoundingClientRect(); let dx = 0, dy = 0;
      if (q.right > pr.left + W - m) dx = pr.left + W - m - q.right;
      if (q.left + dx < pr.left + m) dx = pr.left + m - q.left;
      if (q.bottom > pr.top + H - m) dy = pr.top + H - m - q.bottom;
      if (q.top + dy < pr.top + m) dy = pr.top + m - q.top;
      if (dx) b.style.marginLeft = dx.toFixed(1) + 'px'; if (dy) b.style.marginTop = dy.toFixed(1) + 'px';
    });
  });
}
window.addEventListener('resize', () => { if (location.hash.startsWith('#ep-')) fitBubbles(); });
function route() {
  window.onscroll = null; { const pb = document.getElementById('prog'), fn = document.getElementById('fnext'); if (pb) pb.style.width = '0'; if (fn) { fn.classList.remove('show'); fn.style.display = 'none'; } }
  const m = location.hash.match(/^#ep-(\d+)/), q = location.hash.match(/^#quiz-(\d+)/), l = location.hash.match(/^#lock-(\d+)-(\d+)/);
  if (m) renderEp(+m[1]); else if (q) renderQuiz(+q[1]); else if (l) renderLock(+l[1], +l[2]); else renderHome();
}
buildLang();
window.addEventListener('hashchange', route);
route();
</script>
