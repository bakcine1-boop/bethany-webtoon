<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex,nofollow">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>베다니다움 감리교다움 · 베다니 웹툰</title>
<meta name="description" content="베다니 한인연합감리교회 웹툰 「베다니다움 감리교다움」 모바일판">
<meta property="og:title" content="베다니다움 감리교다움 · 베다니 웹툰">
<meta property="og:description" content="성도님들이 궁금해하실 만한 질문을 쉽고 편안하게 풀어낸 베다니 웹툰">
<meta property="og:image" content="cover.jpg">
<meta name="theme-color" content="#F6F1E7">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html{background:#ECE5D6}
body{font-family:'Pretendard',-apple-system,'Apple SD Gothic Neo',sans-serif;color:#1F2638;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;word-break:keep-all;overflow-wrap:break-word}
a{color:inherit;text-decoration:none}
.app{max-width:600px;margin:0 auto;background:#F6F1E7;min-height:100vh;position:relative}
.wrap{container-type:inline-size}
/* 상단바 */
.bar{position:sticky;top:0;z-index:10;display:flex;align-items:center;justify-content:space-between;height:52px;padding:0 14px;background:rgba(246,241,231,.94);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-bottom:1px solid #E4DAC4;transition:transform .25s}
.bar.hide{transform:translateY(-100%)}
.bar .t{font-size:15px;font-weight:700;color:#1F2A44;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:60%}
.bar button,.bar a.btn{background:none;border:0;font:inherit;font-size:14px;font-weight:600;color:#6B6252;padding:8px 6px;cursor:pointer}
/* 홈 */
.hero{position:relative}
.hero img{display:block;width:100%;aspect-ratio:4/5;object-fit:cover}
.hero .shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(246,241,231,.94) 0%,rgba(246,241,231,.6) 30%,rgba(246,241,231,0) 50%,rgba(246,241,231,0) 78%,#F6F1E7 100%)}
.hero .tx{position:absolute;left:0;right:0;top:9%;text-align:center;padding:0 20px}
.hero .ey{font-size:13px;font-weight:600;letter-spacing:.3em;color:#9A7A3E}
.hero h1{margin-top:14px;font-size:clamp(30px,9cqw,46px);font-weight:800;letter-spacing:-.03em;color:#1F2A44;line-height:1.2}
.hero p{margin-top:14px;font-size:15px;line-height:1.6;color:#3A4156;white-space:pre-line}
.cta{display:flex;gap:10px;padding:4px 20px 8px}
.cta a{flex:1;text-align:center;padding:15px 10px;border-radius:14px;font-size:16px;font-weight:700}
.cta .p{background:#1F2A44;color:#fff}
.cta .s{background:#fff;border:1.5px solid #D9C9A3;color:#1F2A44}
.sec{padding:34px 20px 8px}
.sec h2{font-size:19px;font-weight:800;letter-spacing:-.02em;color:#1F2A44}
.sec .sub{margin-top:4px;font-size:13.5px;color:#7C7466}
.chips{display:flex;gap:10px;overflow-x:auto;padding:14px 20px 6px;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 150px;scroll-snap-align:start;background:#fff;border:1px solid #E4DAC4;border-radius:16px;padding:14px;min-height:112px;display:flex;flex-direction:column;justify-content:space-between}
.chip .n{font-size:12px;font-weight:700;color:#A9802F;letter-spacing:.06em}
.chip .q{margin-top:6px;font-size:14.5px;font-weight:600;line-height:1.4;color:#1F2A44}
.chip.off{opacity:.55}
.part{margin:14px 20px 0;background:#fff;border:1px solid #E4DAC4;border-radius:16px;overflow:hidden}
.part summary{list-style:none;cursor:pointer;padding:16px 18px;display:flex;align-items:center;gap:12px}
.part summary::-webkit-details-marker{display:none}
.part .pn{flex:0 0 auto;font-size:12px;font-weight:800;color:#fff;background:#C9A45C;border-radius:8px;padding:4px 8px}
.part .pt{flex:1;font-size:15.5px;font-weight:700;color:#1F2A44;line-height:1.35}
.part .cnt{font-size:12.5px;color:#9A917F}
.part[open] summary{border-bottom:1px solid #EFE7D6}
.ep-row{display:flex;align-items:center;gap:12px;padding:13px 18px;border-top:1px solid #F3EDE0}
.ep-row:first-of-type{border-top:0}
.ep-row .no{flex:0 0 44px;font-size:13px;font-weight:700;color:#A9802F}
.ep-row .q{flex:1;font-size:14.5px;line-height:1.4;color:#1F2A44}
.ep-row .tag{font-size:11.5px;color:#9A917F;white-space:nowrap}
.ep-row .tag.new{color:#fff;background:#1F2A44;border-radius:6px;padding:3px 7px;font-weight:700}
.ep-row.off .q{color:#9A917F}
.home-foot{padding:44px 20px 60px;text-align:center}
.home-foot img{width:210px;mix-blend-mode:multiply;opacity:.9}
.home-foot p{margin-top:10px;font-size:12px;color:#9A917F}
/* 에피소드 (모든 크기는 화면 폭 기준 cqw) */
.panel{position:relative;width:100%;aspect-ratio:1080/1350;overflow:hidden;container-type:inline-size}
.panel img{display:block;width:100%;height:100%;object-fit:cover}
.gap{height:6.48cqw}
.cover .shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(246,241,231,.92) 0%,rgba(246,241,231,.55) 30%,rgba(246,241,231,0) 48%)}
.cover .t{position:absolute;left:0;right:0;top:11.1cqw;text-align:center}
.cover .eyebrow{font-size:3.15cqw;font-weight:600;letter-spacing:.32em;color:#9A7A3E}
.cover .epno{display:inline-block;margin-top:3.1cqw;font-size:2.8cqw;font-weight:700;letter-spacing:.2em;color:#fff;background:#1F2A44;border-radius:4cqw;padding:1.1cqw 2.8cqw}
.cover .title{margin-top:3.3cqw;font-size:6.67cqw;line-height:1.32;font-weight:800;letter-spacing:-.02em;color:#1F2A44}
.narr{padding:10.2cqw 8.9cqw;text-align:center;font-size:4.26cqw;line-height:1.62;font-weight:500;letter-spacing:-.01em;color:#2A3146}
.narr b{font-weight:700;color:#1F2A44;background:linear-gradient(transparent 62%,#EBD9A8 62%)}
.narr .bl{width:5.2cqw;height:.37cqw;background:#C9A45C;margin:0 auto 4.3cqw;border-radius:2px}
.bub{position:absolute;background:#fff;border:.28cqw solid #1F2638;border-radius:4.3cqw;padding:2.2cqw 3.5cqw;font-size:3.89cqw;line-height:1.42;font-weight:600;letter-spacing:-.02em;text-align:center;white-space:nowrap;box-shadow:0 .55cqw 0 rgba(31,38,56,.12)}
.bub:after{content:'';position:absolute;width:2.8cqw;height:2.8cqw;background:#fff;border-right:.28cqw solid #1F2638;border-bottom:.28cqw solid #1F2638;bottom:-1.6cqw;left:var(--tx,50%);transform:translateX(-50%) rotate(45deg)}
.think{border-radius:5.6cqw}
.think:after{display:none}
.think i,.think u{position:absolute;background:#fff;border:.28cqw solid #1F2638;border-radius:50%}
.think i{width:2.4cqw;height:2.4cqw;bottom:-3.2cqw;left:var(--tx,50%)}
.think u{width:1.5cqw;height:1.5cqw;bottom:-5.4cqw;left:calc(var(--tx,50%) + 1.5cqw)}
.bub.inner{border-style:dashed;color:#4A5066;font-weight:500;background:rgba(255,255,255,.93)}
.bub.inner:after{display:none}
.bub.whisper{font-size:3.3cqw;font-weight:500;color:#3A4156}
.bub.shout{font-size:4.6cqw;font-weight:800;border-width:.5cqw;border-radius:2.2cqw;background:#FFF9E6;transform:rotate(var(--rot,-2deg))}
.bub.shout:after{background:#FFF9E6;border-width:.5cqw}
.sfx{position:absolute;font-weight:900;letter-spacing:-.02em;color:#fff;-webkit-text-stroke:.45cqw #1F2638;paint-order:stroke fill;transform:rotate(var(--rot,-8deg));white-space:nowrap;text-shadow:0 .5cqw 0 rgba(31,38,56,.18)}
.sfx.gold{color:#F2C94C}
.nav .h{margin-top:1.4cqw;font-size:3.1cqw;color:#7C7466;font-weight:500}
.who{display:block;font-size:2.4cqw;font-weight:700;color:#9A7A3E;margin-bottom:.4cqw;letter-spacing:.04em}
/* 정보 카드 */
.info{margin:2cqw 6.5cqw 4cqw;background:#fff;border:1px solid #E4DAC4;border-radius:3.5cqw;padding:6cqw 6cqw 5cqw;box-shadow:0 1cqw 3cqw rgba(31,42,68,.06)}
.info .it{font-size:2.6cqw;font-weight:700;letter-spacing:.24em;color:#A9802F;text-align:center}
.info .ih{margin-top:1.6cqw;font-size:4.6cqw;font-weight:800;color:#1F2A44;text-align:center;letter-spacing:-.02em;line-height:1.35}
.flow{margin-top:4.5cqw;position:relative}
.flow .st{display:flex;gap:3.6cqw;align-items:flex-start;padding:2.6cqw 0;position:relative}
.flow .st:not(:last-child):before{content:'';position:absolute;left:3.7cqw;top:9.6cqw;bottom:-2.6cqw;width:.35cqw;background:#E8DCC0}
.flow .n{flex:0 0 7.4cqw;height:7.4cqw;border-radius:50%;background:#1F2A44;color:#fff;font-size:3.4cqw;font-weight:800;display:flex;align-items:center;justify-content:center;position:relative;z-index:1}
.flow .k{font-size:4.1cqw;font-weight:800;color:#1F2A44;line-height:1.3}
.flow .d{margin-top:.8cqw;font-size:3.5cqw;line-height:1.55;color:#4A5066}
.chips2{margin-top:4.5cqw;display:flex;flex-wrap:wrap;gap:2cqw;justify-content:center}
.chips2 span{font-size:3.5cqw;font-weight:700;color:#1F2A44;background:#F6F1E7;border:1px solid #E4DAC4;border-radius:5cqw;padding:1.6cqw 3.2cqw}
.chips2 i{font-style:normal;color:#C9A45C;font-weight:800;align-self:center;font-size:3.4cqw}
.stat{margin-top:3.5cqw;text-align:center}
.stat .big{font-size:17cqw;font-weight:900;color:#1F2A44;letter-spacing:-.04em;line-height:1}
.stat .big em{font-style:normal;color:#A9802F}
.stat .d{margin-top:2.5cqw;font-size:3.8cqw;line-height:1.6;color:#4A5066}
.sum{margin:6cqw 6.5cqw 0;background:#1F2A44;border-radius:3.5cqw;padding:6cqw 6.5cqw;color:#fff}
.sum .it{font-size:2.6cqw;font-weight:700;letter-spacing:.24em;color:#E3C47E}
.sum ol{list-style:none;margin-top:3cqw;counter-reset:s}
.sum li{counter-increment:s;display:flex;gap:3cqw;font-size:3.9cqw;line-height:1.55;padding:1.6cqw 0;border-top:1px solid rgba(255,255,255,.12)}
.sum li:first-child{border-top:0}
.sum li:before{content:counter(s);flex:0 0 auto;font-weight:800;color:#E3C47E}
.panel.sepia img{filter:sepia(.55) saturate(.8) brightness(1.03)}
.panel .tag{position:absolute;left:4cqw;top:4cqw;background:rgba(31,42,68,.85);color:#fff;font-size:2.8cqw;font-weight:700;border-radius:2cqw;padding:1.2cqw 2.6cqw;letter-spacing:.05em}
.closing{padding:11cqw 7.4cqw 6.5cqw;text-align:center;font-size:5.56cqw;line-height:1.45;font-weight:800;letter-spacing:-.025em;color:#1F2A44}
.closing em{font-style:normal;color:#A9802F}
.nav{display:flex;gap:2.6cqw;padding:2cqw 7.4cqw 0}
.nav a,.nav span{flex:1;display:block;border:2px solid #D9C9A3;border-radius:2.6cqw;padding:4cqw 3cqw;text-align:center;background:#FBF8F1}
.nav .k{font-size:2.6cqw;font-weight:700;letter-spacing:.2em;color:#A9802F}
.nav .q{margin-top:1.3cqw;font-size:3.9cqw;font-weight:700;color:#1F2A44;line-height:1.35}
.nav span{opacity:.6}
.nav span .q{color:#7C7466}
.toc{display:block;margin:4cqw 7.4cqw 0;text-align:center;padding:3.6cqw;border-radius:2.6cqw;background:#1F2A44;color:#fff;font-size:3.9cqw;font-weight:700}
.efoot{padding:8.3cqw 0 10cqw;text-align:center}
.efoot img{width:38.9cqw;mix-blend-mode:multiply;opacity:.92}
.efoot .s{margin-top:2cqw;font-size:2.2cqw;color:#8A8577}
/* 캡처 모드(카톡용 긴 이미지) */
.capture html,.capture{background:#F6F1E7}
.capture .app{max-width:none}
.capture .bar,.capture .toc,.capture .share{display:none}
.lang{position:absolute;top:14px;right:14px;z-index:3;background:rgba(255,255,255,.88);border:1px solid #D9C9A3;border-radius:999px;padding:7px 13px;font:inherit;font-size:13px;font-weight:700;color:#1F2A44;cursor:pointer;letter-spacing:.02em}
.bar .rt{display:flex;align-items:center;gap:4px}
.bar .lg{border:1px solid #D9C9A3 !important;border-radius:999px;padding:5px 10px !important;font-size:12.5px !important;color:#1F2A44 !important}
html[lang=en] .bub{letter-spacing:-.01em}
html[lang=en] .narr{letter-spacing:0}
html[lang=en] .narr,html[lang=en] .closing,html[lang=en] .sum li{text-wrap:pretty}
.capture .lang,.capture .lg{display:none}
html.capture{scrollbar-width:none}
html.capture::-webkit-scrollbar,.capture ::-webkit-scrollbar{display:none;width:0}
</style>
</head>
<body>
<div class="app wrap" id="app"></div>
<script src="data.js?v=202611062201"></script>
<script src="data_en.js?v=202611062201"></script>
<script>
const K = window.WEBTOON, EN = window.WEBTOON_EN;
const QS = new URLSearchParams(location.search);
const CAPTURE = QS.has('capture');
if (CAPTURE) document.documentElement.classList.add('capture');
const langKey = 'bethany-webtoon-lang';
let LANG = QS.get('lang') || localStorage.getItem(langKey) || 'ko';
if (LANG !== 'en') LANG = 'ko';
const app = document.getElementById('app');
const nl = s => s.replace(/\n/g, '<br>');
const lastKey = 'bethany-webtoon-last';
const UI_KO = { start: '1화부터 보기', cont: n => `이어 보기 · ${n}화`, starterH: '처음 오셨다면, 이것부터', starterSub: '새가족이 가장 먼저 궁금해하는 10편',
  tocH: '전체 목차', tocSub: '8부 · 63화', cnt: n => `${n}화`, read: '보기', soon: '준비 중', ep: n => `제${n}화`, epShort: n => `${n}화`,
  back: '← 목차', share: '공유', copied: '링크를 복사했어요', sum: '오늘의 정리', prev: 'PREV', next: 'NEXT EPISODE', nextSoon: 'NEXT EPISODE · 준비 중', toc: '전체 목차 보기', restart: '처음부터 다시 보기',
  foot: `웹툰 「${K.series}」 · 모바일판`, homeFoot: '웹툰 「베다니다움 감리교다움」 · 원작 『베다니다움, 감리교다움』', flow: '한눈에 보기', stat: '기억하기', siteTitle: '베다니다움 감리교다움 · 베다니 웹툰' };
let W, U;
function buildLang() {
  document.documentElement.lang = LANG;
  if (LANG !== 'en') { W = K; U = UI_KO; return; }
  U = EN.ui;
  const eps = {};
  for (const n in K.episodes) {
    const k = K.episodes[n], e = EN.episodes[n];
    if (!e) continue;
    eps[n] = { ...k, coverTitle: e.coverTitle, closing: e.closing, hook: e.hook, summary: e.summary,
      blocks: k.blocks.map((b, i) => {
        const o = e.blocks[i]; if (!o) return b;
        const m = { ...b };
        if (o.bubbles) m.bubbles = (b.bubbles || []).map((x, j) => ({ ...x, ...(o.bubbles[j] || {}), who: x.who ? (o.bubbles[j] && o.bubbles[j].who) || x.who : undefined }));
        for (const f of ['narr', 'flow', 'chips', 'stat', 'tag']) if (o[f]) m[f] = o[f];
        return m;
      }) };
  }
  W = { ...K, series: EN.series, intro: EN.intro, titles: EN.titles, parts: K.parts.map((p, i) => ({ ...p, ...EN.parts[i] })), episodes: eps };
}
const ready = n => !!W.episodes[n];
function toggleLang() { LANG = LANG === 'en' ? 'ko' : 'en'; localStorage.setItem(langKey, LANG); if (QS.has('lang')) { QS.delete('lang'); history.replaceState(null, '', location.pathname + (QS.toString() ? '?' + QS : '') + location.hash); } buildLang(); route(); }
const langBtnLabel = () => LANG === 'en' ? '한국어' : 'English';

function bubble(b) {
  if (b.sfx) return `<div class="sfx${b.gold ? ' gold' : ''}" style="left:${(b.x / 1080 * 100).toFixed(2)}%;top:${(b.y / 1350 * 100).toFixed(2)}%;font-size:${((b.fs || 70) / 1080 * 100).toFixed(2)}cqw;${b.rot != null ? `--rot:${b.rot}deg;` : ''}">${b.sfx}</div>`;
  const style = `left:${(b.x / 1080 * 100).toFixed(2)}%;top:${(b.y / 1350 * 100).toFixed(2)}%;${b.tx ? `--tx:${b.tx};` : ''}${b.fs ? `font-size:${(b.fs / 1080 * 100).toFixed(2)}cqw;` : ''}`;
  return `<div class="bub${b.think ? ' think' : ''}${b.kind ? ' ' + b.kind : ''}" style="${style}${b.rot != null ? `--rot:${b.rot}deg;` : ''}">${b.who ? `<span class="who">${b.who}</span>` : ''}${nl(b.t)}${b.think ? '<i></i><u></u>' : ''}</div>`;
}

function renderHome() {
  document.title = U.siteTitle;
  const last = +localStorage.getItem(lastKey) || 0;
  const firstReady = Object.keys(W.episodes).map(Number).sort((a, b) => a - b)[0];
  let h = `<div class="hero"><img src="cover.jpg" alt=""><div class="shade"></div><button class="lang" onclick="toggleLang()">${langBtnLabel()}</button>
    <div class="tx"><div class="ey">BETHANY WEBTOON</div><h1>${W.series}</h1><p>${W.intro}</p></div></div>
    <div class="cta"><a class="p" href="#ep-${firstReady}">${U.start}</a>${last && ready(last) ? `<a class="s" href="#ep-${last}">${U.cont(last)}</a>` : ''}</div>
    <div class="sec"><h2>${U.starterH}</h2><div class="sub">${U.starterSub}</div></div>
    <div class="chips">${W.starter.map(n => ready(n)
      ? `<a class="chip" href="#ep-${n}"><div class="n">${U.ep(n)}</div><div class="q">${W.titles[n]}</div></a>`
      : `<div class="chip off"><div class="n">${U.ep(n)} · ${U.soon}</div><div class="q">${W.titles[n]}</div></div>`).join('')}</div>
    <div class="sec"><h2>${U.tocH}</h2><div class="sub">${U.tocSub}</div></div>`;
  W.parts.forEach((p, i) => {
    h += `<details class="part"${i === 0 ? ' open' : ''}><summary><span class="pn">${p.name}</span><span class="pt">${p.title}</span><span class="cnt">${U.cnt(p.eps.length)}</span></summary>
      ${p.eps.map(n => ready(n)
        ? `<a class="ep-row" href="#ep-${n}"><span class="no">${U.epShort(n)}</span><span class="q">${W.titles[n]}</span><span class="tag new">${U.read}</span></a>`
        : `<div class="ep-row off"><span class="no">${U.epShort(n)}</span><span class="q">${W.titles[n]}</span><span class="tag">${U.soon}</span></div>`).join('')}</details>`;
  });
  h += `<div class="home-foot"><img src="logo.png" alt="Bethany Korean United Methodist Church"><p>${U.homeFoot}</p></div>`;
  app.innerHTML = h;
  window.scrollTo(0, 0);
}

function renderEp(n) {
  const ep = W.episodes[n];
  if (!ep) { location.hash = ''; return; }
  localStorage.setItem(lastKey, n);
  document.title = `${U.ep(n)} ${W.titles[n]} · ${LANG === 'en' ? 'Bethany Webtoon' : '베다니 웹툰'}`;
  let h = `<div class="bar" id="bar"><a class="btn" href="#">${U.back}</a><div class="t">${U.ep(n)}</div><div class="rt"><button class="lg" onclick="toggleLang()">${LANG === 'en' ? '한' : 'EN'}</button><button class="share" onclick="share(${n})">${U.share}</button></div></div>`;
  for (const b of ep.blocks) {
    if (b.cover) h += `<div class="panel cover"><img src="${b.cover}" alt=""><div class="shade"></div><div class="t"><div class="eyebrow">${W.series}</div><div class="epno">${U.ep(n)}</div><div class="title">${nl(ep.coverTitle || W.titles[n])}</div></div></div>`;
    else if (b.img) h += `<div class="panel${b.sepia ? ' sepia' : ''}"><img src="${b.img}" alt="" loading="lazy">${b.tag ? `<div class="tag">${b.tag}</div>` : ''}${(b.bubbles || []).map(bubble).join('')}</div>`;
    else if (b.narr) h += `<div class="narr"><div class="bl"></div>${nl(b.narr)}</div>`;
    else if (b.gap) h += `<div class="gap"></div>`;
    else if (b.flow) h += `<div class="info"><div class="it">${b.flow.label || U.flow}</div><div class="ih">${nl(b.flow.title)}</div><div class="flow">${b.flow.steps.map((s, i) => `<div class="st"><div class="n">${i + 1}</div><div><div class="k">${s.k}</div>${s.d ? `<div class="d">${nl(s.d)}</div>` : ''}</div></div>`).join('')}</div></div>`;
    else if (b.chips) h += `<div class="info"><div class="it">${b.chips.label || U.flow}</div><div class="ih">${nl(b.chips.title)}</div><div class="chips2">${b.chips.items.map(t => `<span>${t}</span>`).join('<i>›</i>')}</div></div>`;
    else if (b.stat) h += `<div class="info"><div class="it">${b.stat.label || U.stat}</div><div class="stat"><div class="big">${b.stat.big}</div><div class="d">${nl(b.stat.d)}</div></div></div>`;
  }
  if (ep.summary) h += `<div class="sum"><div class="it">${U.sum}</div><ol>${ep.summary.map(s => `<li><span>${s}</span></li>`).join('')}</ol></div>`;
  const prev = n - 1, next = n + 1;
  h += `<div class="closing">${nl(ep.closing)}</div><div class="nav">`;
  if (prev >= 1 && !CAPTURE) h += ready(prev) ? `<a href="#ep-${prev}"><div class="k">${U.prev}</div><div class="q">${U.ep(prev)}</div></a>` : `<span><div class="k">${U.prev}</div><div class="q">${U.ep(prev)}</div></span>`;
  if (next <= 63) h += ready(next) ? `<a href="#ep-${next}"><div class="k">${U.next}</div><div class="q">${U.ep(next)} · ${W.titles[next]}</div>${ep.hook ? `<div class="h">${ep.hook}</div>` : ''}</a>` : `<span><div class="k">${U.nextSoon}</div><div class="q">${U.ep(next)} · ${W.titles[next]}</div>${ep.hook ? `<div class="h">${ep.hook}</div>` : ''}</span>`;
  if (next > 63) h += `<a href="#ep-1"><div class="k">THE END</div><div class="q">${U.restart}</div></a>`;
  h += `</div><a class="toc" href="#">${U.toc}</a><div class="efoot"><img src="logo.png" alt="Bethany Korean United Methodist Church"><div class="s">${U.foot}</div></div>`;
  app.innerHTML = h;
  window.scrollTo(0, 0);
  let lastY = 0; const bar = document.getElementById('bar');
  window.onscroll = () => { const y = window.scrollY; if (bar) bar.classList.toggle('hide', y > lastY && y > 120); lastY = y; };
}

async function share(n) {
  const url = location.href.split('#')[0].split('?')[0] + (LANG === 'en' ? '?lang=en' : '') + '#ep-' + n;
  const data = { title: LANG === 'en' ? `Bethany Webtoon · Episode ${n}` : `베다니 웹툰 제${n}화`, text: W.titles[n], url };
  try { if (navigator.share) await navigator.share(data); else { await navigator.clipboard.writeText(url); alert(U.copied); } } catch (e) {}
}

function route() {
  window.onscroll = null;
  const m = location.hash.match(/^#ep-(\d+)/);
  if (m) renderEp(+m[1]); else renderHome();
}
buildLang();
window.addEventListener('hashchange', route);
route();
</script>
</body>
</html>
